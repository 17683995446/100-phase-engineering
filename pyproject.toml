[project]
name = "multi-agent-engineering-system"
version = "0.1.0"
description = "轻量化多Agent软件工程系统 - 基于第一性原理+开源复用"
authors = [
    { name = "System Team" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "langgraph>=0.2.0",
    "pyautogen>=0.2.0",
    "tree-sitter>=0.22.0",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line-length = 120

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
